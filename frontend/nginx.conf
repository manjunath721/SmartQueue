
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health check
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
